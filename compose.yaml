name: tbtb

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Define SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${TBTB_DB_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    environment:
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Define SA_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Define APP_DB_PASSWORD in .env}
      DEMO_REFERENCE_UTC: ${DEMO_REFERENCE_UTC:-2026-09-24T15:00:00Z}
      LOAD_DEMO_CONTACTS: "true"
      LOAD_TEST_SEED: "false"
    volumes:
      - ./scripts:/scripts:ro
      - ./docker/sqlserver/init.sh:/init.sh:ro
    entrypoint: ["/bin/bash", "/init.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DemoAuthEnabled: "true"
      ConnectionStrings__Tbtb: Server=db,1433;Database=Tbtb;User Id=tbtb_app;Password=${APP_DB_PASSWORD:?Define APP_DB_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True
    ports:
      - "127.0.0.1:${TBTB_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:${TBTB_PUBLIC_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver-data:
