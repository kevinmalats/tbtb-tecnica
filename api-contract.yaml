            - "SIN_RESPUESTA"
            - "FALLIDO"
        "reason":
          "type": "string"
          "minLength": 10
          "maxLength": 500
          "description": "Longitud después de trim."
        "expectedVersion":
          "type": "string"
          "format": "byte"
          "minLength": 12
          "maxLength": 12
          "pattern": "^[A-Za-z0-9+/]{10}[AEIMQUYcgkosw048]=$"
          "description": "Base64 canónico de ocho bytes de rowversion. Token opaco, no contador ni fecha."
      "description": "Debe cambiar fecha efectiva, canal o resultado; cambiar únicamente motivo no basta. Paciente, gestor y ciudad no son editables. Una versión obsoleta válida produce 409."
