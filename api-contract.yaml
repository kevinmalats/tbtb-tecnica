              "expectedVersion": "AAAAAAAAAAE="
  "/api/v1/contacts/{id}/history":
    "get":
      "operationId": "getContactHistory"
      "summary": "Consultar historial de contacto"
      "description": "Todas las revisiones en orden ascendente. Gestor ejecutor o coordinadora. recordedAt es fecha de captura, occurredAt es fecha efectiva."
      "tags":
        - "Contactos"
      "x-acceptance-scenarios":
        - "CA03-01"
        - "CA03-02"
        - "SEC-03"
      "x-acceptance-criteria":
        - "CA-3 (parcial)"
      "responses":
        "200":
          "description": "Operación satisfactoria."
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/ContactRevision"
              "example":
                -
                  "contactId": "cccccccc-cccc-4ccc-8ccc-ccccccccccc1"
                  "revision": 1
