        - "documentCountryCode"
        - "documentTypeCode"
        - "documentNumber"
        - "phone"
        - "cityId"
        - "treatmentStartDate"
      "properties":
        "fullName":
          "type": "string"
          "minLength": 1
          "maxLength": 150
          "description": "Trim; no puede quedar vacío."
        "documentCountryCode":
          "type": "string"
          "enum":
            - "CO"
            - "PE"
            - "EC"
        "documentTypeCode":
          "type": "string"
          "enum":
            - "NATIONAL_ID"
            - "FOREIGN_ID"
            - "PASSPORT"
        "documentNumber":
          "type": "string"
          "minLength": 1
          "maxLength": 40
          "description": "Trim y mayúsculas invariantes para unicidad. Conservar ceros y puntuación interna."
        "phone":
          "type": "string"
          "minLength": 7
          "maxLength": 30
          "pattern": "^(?=(?:[^0-9]*[0-9]){7})[0-9 +()\\-]+$"
          "description": "Tras trim, al menos siete dígitos y solo los caracteres indicados."
        "email":
          "type": "string"
          "nullable": true
          "maxLength": 254
          "description": "Opcional: omitido, null, vacío o solo espacios se normalizan a null. Si tiene contenido, trim y sintaxis de correo válida."
        "cityId":
          "type": "integer"
          "minimum": 1
        "treatmentStartDate":
          "type": "string"
          "format": "date"
      "description": "Solo gestor. Inicio de tratamiento no posterior al día actual en Bogotá. Sin actor ni gestor en el cuerpo. Campos no reconocidos se rechazan con 400."
