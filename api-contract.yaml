      "summary": "Corregir contacto con historial"
      "description": "Solo gestor ejecutor. Coordinadora con recurso visible: 403. Otro gestor: 404. Tras validar estructura y visibilidad, comparar versión antes de comprobar si existen cambios. Actualizar revisión vigente y añadir historial en una transacción; revertir todo si hay conflicto. El token devuelto cambia."
      "tags":
        - "Contactos"
      "x-acceptance-scenarios":
        - "CA03-01"
        - "CA03-02"
        - "CA03-03"
