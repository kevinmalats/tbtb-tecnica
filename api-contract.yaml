  "/api/v1/follow-ups":
    "post":
      "operationId": "scheduleFollowUp"
      "summary": "Agendar seguimiento manual"
      "description": "Solo gestor asignado. Sin cumplimiento automático, recordatorios ni enlace obligatorio a un contacto. Se admiten dos seguimientos a la misma hora; no se ha definido exclusión de agenda."
      "tags":
        - "Agenda"
      "x-acceptance-scenarios":
        - "CA01-01"
        - "CA01-05"
        - "SEC-02"
        - "SEC-03"
      "x-acceptance-criteria":
        - "CA-1"
      "responses":
        "201":
          "description": "Operación satisfactoria."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/FollowUp"
              "example":
                "id": "dddddddd-dddd-4ddd-8ddd-ddddddddddd1"
                "patientId": "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1"
                "managerId": "11111111-1111-4111-8111-111111111111"
                "scheduledAt": "2026-09-25T15:00:00Z"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "500":
          "$ref": "#/components/responses/InternalError"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateFollowUpRequest"
            "example":
              "patientId": "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1"
              "scheduledAt": "2026-09-25T15:00:00Z"
    "get":
      "operationId": "listFollowUps"
      "summary": "Listar agenda de un paciente"
      "description": "Orden scheduledAt ascendente y después id ascendente según SQL Server; lista vacía si no hay seguimientos."
      "tags":
        - "Agenda"
      "x-acceptance-scenarios":
        - "CA01-01"
        - "SEC-03"
      "x-acceptance-criteria":
        - "CA-1"
      "responses":
        "200":
          "description": "Operación satisfactoria."
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/FollowUp"
              "example":
                -
                  "id": "dddddddd-dddd-4ddd-8ddd-ddddddddddd1"
                  "patientId": "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1"
                  "managerId": "11111111-1111-4111-8111-111111111111"
                  "scheduledAt": "2026-09-25T15:00:00Z"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "500":
          "$ref": "#/components/responses/InternalError"
      "parameters":
        -
          "name": "patientId"
          "in": "query"
          "required": true
          "description": "Paciente visible requerido."
          "schema":
            "type": "string"
            "format": "uuid"
  "/api/v1/contacts":
    "post":
      "operationId": "registerContact"
      "summary": "Registrar contacto realizado"
      "description": "Solo gestor asignado. Crea contacto y revisión 1 en una transacción. Ciudad copiada del paciente y gestor del contexto. No reintentar automáticamente POST: el contrato no garantiza idempotencia."
      "tags":
        - "Contactos"
      "x-acceptance-scenarios":
        - "CA02-01"
        - "CA02-02"
        - "CA02-03"
        - "CA02-04"
        - "SEC-02"
        - "SEC-03"
      "x-acceptance-criteria":
        - "CA-2"
      "responses":
        "201":
          "description": "Operación satisfactoria."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Contact"
              "example":
                "id": "cccccccc-cccc-4ccc-8ccc-ccccccccccc1"
                "patientId": "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1"
                "patientName": "Paciente de prueba A"
                "managerId": "11111111-1111-4111-8111-111111111111"
                "managerName": "Gestor A"
                "cityId": 1
                "cityName": "Bogotá"
                "occurredAt": "2026-09-10T15:00:00Z"
                "channel": "LLAMADA"
                "result": "SIN_RESPUESTA"
                "revision": 1
                "version": "AAAAAAAAAAE="
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "500":
          "$ref": "#/components/responses/InternalError"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateContactRequest"
            "example":
              "patientId": "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1"
              "occurredAt": "2026-09-10T15:00:00Z"
              "channel": "LLAMADA"
              "result": "SIN_RESPUESTA"
    "get":
      "operationId": "listMonthlyContacts"
      "summary": "Consultar contactos del mes"
      "description": "Solo revisión vigente. Intersección de filtros. Intervalo mensual [inicio, inicio siguiente mes), convertido a UTC. Gestor siempre restringido a sus contactos. Orden occurredAt DESC, id DESC según SQL Server uniqueidentifier. total refleja filtros y permisos. Sin garantía de snapshot entre solicitudes concurrentes. Mes sin filas o página fuera de resultados devuelve 200 con items vacío."
      "tags":
        - "Contactos"
      "x-acceptance-scenarios":
        - "CA04-01"
        - "CA04-02"
        - "CA04-03"
        - "CA04-04"
        - "CA04-05"
        - "CA03-03"
        - "SEC-04"
        - "HTTP-01"
      "x-acceptance-criteria":
        - "CA-4"
        - "CA-3 (parcial)"
      "responses":
        "200":
          "description": "Operación satisfactoria."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ContactPage"
              "example":
                "items":
                  -
                    "id": "cccccccc-cccc-4ccc-8ccc-ccccccccccc1"
                    "patientId": "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1"
                    "patientName": "Paciente de prueba A"
                    "managerId": "11111111-1111-4111-8111-111111111111"
                    "managerName": "Gestor A"
                    "cityId": 1
                    "cityName": "Bogotá"
                    "occurredAt": "2026-09-10T15:00:00Z"
                    "channel": "LLAMADA"
                    "result": "SIN_RESPUESTA"
                    "revision": 1
                    "version": "AAAAAAAAAAE="
                "total": 1
                "page": 1
                "pageSize": 20
                "month": "2026-09"
                "timeZone": "America/Bogota"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "500":
          "$ref": "#/components/responses/InternalError"
      "parameters":
        -
          "name": "month"
          "in": "query"
          "required": false
          "description": "Omitido: mes actual en Bogotá; vacío es inválido."
          "schema":
            "type": "string"
            "pattern": "^[0-9]{4}-(0[1-9]|1[0-2])$"
            "description": "Mes civil de America/Bogota; años admitidos 0001 a 9998 para poder calcular el inicio del mes siguiente."
        -
          "name": "managerId"
          "in": "query"
          "required": false
          "description": "Otro gestor existente: 403 para gestor; desconocido: 400."
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "cityId"
          "in": "query"
          "required": false
          "description": "Ciudad de catálogo; desconocida: 400."
          "schema":
            "type": "integer"
            "minimum": 1
        -
          "name": "page"
          "in": "query"
          "required": false
          "description": "Página comenzando en 1."
          "schema":
            "type": "integer"
            "minimum": 1
            "default": 1
        -
          "name": "pageSize"
          "in": "query"
          "required": false
          "description": "Tamaño; no truncar valores inválidos."
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
