"components":
  "securitySchemes":
    "DemoActor":
      "type": "apiKey"
      "in": "header"
      "name": "X-Demo-Actor-Id"
      "description": "UUID de actor precargado. Ausente, UUID inválido, desconocido o modo demo deshabilitado: 401. Los permisos se verifican en servidor. Health es anónimo."
  "schemas":
    "CreatePatientRequest":
      "type": "object"
      "additionalProperties": false
      "required":
