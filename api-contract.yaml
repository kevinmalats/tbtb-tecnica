  "responses":
    "BadRequest":
      "description": "JSON/campos/filtros inválidos: VALIDATION_ERROR. Corrección sin cambios: NO_CHANGES. errors es obligatorio para VALIDATION_ERROR."
      "content":
        "application/problem+json":
          "schema":
            "$ref": "#/components/schemas/Problem"
          "examples":
            "futureContact":
              "value":
                "type": "about:blank"
                "title": "La solicitud contiene datos inválidos."
                "status": 400
                "code": "VALIDATION_ERROR"
                "traceId": "demo-trace-0001"
                "errors":
                  "occurredAt":
                    - "La fecha del contacto no puede estar en el futuro."
            "invalidField":
              "value":
                "type": "about:blank"
                "title": "La solicitud contiene datos inválidos."
                "status": 400
                "code": "VALIDATION_ERROR"
                "traceId": "demo-trace-0001"
                "errors":
                  "$":
                    - "El cuerpo o sus campos no son válidos."
            "noChanges":
              "value":
                "type": "about:blank"
                "title": "La corrección no modifica los datos del contacto."
                "status": 400
                "code": "NO_CHANGES"
                "traceId": "demo-trace-0001"
    "Unauthorized":
      "description": "Se requiere un actor de demostración válido."
      "content":
        "application/problem+json":
          "schema":
            "$ref": "#/components/schemas/Problem"
          "example":
            "type": "about:blank"
            "title": "Se requiere un actor de demostración válido."
            "status": 401
            "code": "DEMO_ACTOR_REQUIRED"
            "traceId": "demo-trace-0001"
      "headers":
        "WWW-Authenticate":
          "schema":
            "type": "string"
          "description": "Desafío local informativo; no representa autenticación productiva."
          "example": "DemoActor realm=\"local-demo\""
    "Forbidden":
      "description": "El actor no tiene permiso para esta acción."
      "content":
        "application/problem+json":
          "schema":
            "$ref": "#/components/schemas/Problem"
          "example":
            "type": "about:blank"
            "title": "El actor no tiene permiso para esta acción."
            "status": 403
            "code": "FORBIDDEN"
            "traceId": "demo-trace-0001"
    "NotFound":
