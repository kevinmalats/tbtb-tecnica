          "type": "string"
          "format": "uri"
          "example": "about:blank"
        "title":
          "type": "string"
        "status":
          "type": "integer"
          "minimum": 400
          "maximum": 599
        "code":
          "type": "string"
          "enum":
            - "VALIDATION_ERROR"
            - "DEMO_ACTOR_REQUIRED"
            - "FORBIDDEN"
            - "RESOURCE_NOT_FOUND"
            - "PATIENT_ALREADY_EXISTS"
            - "CONTACT_VERSION_CONFLICT"
            - "NO_CHANGES"
            - "INTERNAL_ERROR"
