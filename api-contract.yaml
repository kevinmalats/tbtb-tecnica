# Contrato de diseño; todavía no implementado.
"openapi": "3.0.3"
"info":
  "title": "TBTB - Contactos de pacientes"
  "version": "0.1.0"
  "description": "Contrato previo a implementación, derivado de 02-plan.md. CA-1, CA-2 y CA-4 previstos completos; CA-3 parcial; CA-5/CA-6 excluidos. No hay reporte de adherencia. Todos los ejemplos usan datos ficticios y reloj 2026-09-24T15:00:00Z. Fechas con offset y máximo tres decimales. Campos desconocidos en cuerpos se rechazan. Las reglas de negocio no expresables en JSON Schema se verifican en el servicio. Identity de demostración exclusiva del entorno local; no es autenticación productiva."
"externalDocs":
  "description": "Especificación OpenAPI utilizada"
  "url": "https://spec.openapis.org/oas/v3.0.3.html"
"servers":
  -
    "url": "http://localhost:4200"
    "description": "Origen local previsto; /api se redirige a API y /health es para acceso interno o proxy explícito. No implica servidor ya disponible."
"security":
  -
    "DemoActor": []
"tags":
  -
    "name": "Catálogos"
  -
    "name": "Pacientes"
  -
    "name": "Agenda"
  -
    "name": "Contactos"
  -
    "name": "Salud"
"paths":
  "/api/v1/catalogs":
    "get":
      "operationId": "getCatalogs"
      "summary": "Consultar catálogos"
      "description": "Gestor recibe solo su entrada en managers; coordinadora recibe todos. Los demás catálogos son comunes. El selector inicial de actor se configura localmente; este endpoint requiere actor."
      "tags":
        - "Catálogos"
      "x-acceptance-scenarios":
        - "SEC-01"
        - "CAT-01"
      "x-acceptance-criteria": []
      "responses":
        "200":
          "description": "Operación satisfactoria."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Catalogs"
              "example":
                "countries":
                  -
                    "code": "CO"
                    "name": "Colombia"
                  -
                    "code": "PE"
                    "name": "Perú"
                  -
                    "code": "EC"
                    "name": "Ecuador"
                "cities":
                  -
                    "id": 1
                    "countryCode": "CO"
                    "name": "Bogotá"
                  -
                    "id": 2
                    "countryCode": "PE"
                    "name": "Lima"
                "documentTypes":
                  -
                    "code": "NATIONAL_ID"
                    "name": "NATIONAL_ID"
                  -
                    "code": "FOREIGN_ID"
                    "name": "FOREIGN_ID"
                  -
                    "code": "PASSPORT"
                    "name": "PASSPORT"
                "channels":
                  -
                    "code": "LLAMADA"
                    "name": "LLAMADA"
                  -
                    "code": "WHATSAPP"
                    "name": "WHATSAPP"
                  -
                    "code": "CORREO"
                    "name": "CORREO"
                "results":
                  -
                    "code": "CONTACTADO"
                    "name": "CONTACTADO"
                  -
                    "code": "SIN_RESPUESTA"
                    "name": "SIN_RESPUESTA"
                  -
                    "code": "FALLIDO"
                    "name": "FALLIDO"
                "managers":
                  -
                    "id": "11111111-1111-4111-8111-111111111111"
                    "displayName": "Gestor A"
                  -
                    "id": "22222222-2222-4222-8222-222222222222"
                    "displayName": "Gestor B"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "500":
          "$ref": "#/components/responses/InternalError"
  "/api/v1/patients":
    "post":
      "operationId": "registerPatient"
      "summary": "Registrar paciente"
      "description": "Solo GESTOR. assignedManagerId y CreatedBy se resuelven desde el actor. Email vacío se devuelve null. Unicidad global de identidad; la respuesta de duplicado no revela datos del paciente existente."
      "tags":
        - "Pacientes"
      "x-acceptance-scenarios":
        - "CA01-01"
        - "CA01-02"
        - "CA01-03"
        - "CA01-04"
        - "SEC-02"
      "x-acceptance-criteria":
        - "CA-1"
      "responses":
        "201":
          "description": "Operación satisfactoria."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Patient"
              "example":
                "id": "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1"
                "fullName": "Paciente de prueba A"
                "documentCountryCode": "CO"
                "documentTypeCode": "NATIONAL_ID"
                "documentNumber": "001234"
                "phone": "+57 300 000 0000"
                "email": null
                "cityId": 1
                "treatmentStartDate": "2026-08-01"
                "cityName": "Bogotá"
                "assignedManagerId": "11111111-1111-4111-8111-111111111111"
          "headers":
            "Location":
              "schema":
                "type": "string"
                "format": "uri-reference"
              "example": "/api/v1/patients/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1"
              "description": "Ruta del paciente creado."
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "500":
          "$ref": "#/components/responses/InternalError"
        "415":
          "$ref": "#/components/responses/UnsupportedMediaType"
        "409":
          "description": "Ya existe un paciente con esa identidad."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/Problem"
              "example":
                "type": "about:blank"
                "title": "Ya existe un paciente con esa identidad."
                "status": 409
                "code": "PATIENT_ALREADY_EXISTS"
                "traceId": "demo-trace-0001"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreatePatientRequest"
            "example":
              "fullName": "Paciente de prueba A"
              "documentCountryCode": "CO"
              "documentTypeCode": "NATIONAL_ID"
              "documentNumber": "001234"
              "phone": "+57 300 000 0000"
              "email": null
              "cityId": 1
              "treatmentStartDate": "2026-08-01"
    "get":
      "operationId": "listPatients"
      "summary": "Listar pacientes visibles"
      "description": "Gestor: solo asignados. Coordinadora: todos. Orden id ascendente según SQL Server uniqueidentifier, sin garantía de orden lexicográfico textual. Página fuera de resultados: items vacío y total sin cambiar."
      "tags":
        - "Pacientes"
      "x-acceptance-scenarios":
        - "CA01-01"
        - "SEC-03"
        - "HTTP-01"
      "x-acceptance-criteria":
        - "CA-1"
      "responses":
        "200":
          "description": "Operación satisfactoria."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PatientPage"
              "example":
                "items":
                  -
                    "id": "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1"
                    "fullName": "Paciente de prueba A"
                    "documentCountryCode": "CO"
                    "documentTypeCode": "NATIONAL_ID"
                    "documentNumber": "001234"
                    "phone": "+57 300 000 0000"
                    "email": null
                    "cityId": 1
                    "treatmentStartDate": "2026-08-01"
                    "cityName": "Bogotá"
                    "assignedManagerId": "11111111-1111-4111-8111-111111111111"
                "total": 1
                "page": 1
                "pageSize": 20
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "500":
          "$ref": "#/components/responses/InternalError"
      "parameters":
        -
          "name": "page"
          "in": "query"
          "required": false
          "description": "Página comenzando en 1."
          "schema":
            "type": "integer"
            "minimum": 1
            "default": 1
        -
          "name": "pageSize"
          "in": "query"
          "required": false
          "description": "Tamaño; no truncar valores inválidos."
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 100
            "default": 20
